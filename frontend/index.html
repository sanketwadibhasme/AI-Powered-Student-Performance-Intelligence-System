<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduIntel AI:Student Performance Intelligence System</title>
<link rel="stylesheet" href="css/spis.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🎓</div>
      <div class="name">EduIntel AI<small>Performance Intelligence</small></div>
    </div>
    <nav class="nav" id="sideNav"><!-- role-based links injected --></nav>
    <div style="flex:1"></div>
    <div style="padding:14px 18px;border-top:1px solid #1e293b;font-size:11.5px;color:#64748b">
      V0 · final-year project build
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="flex">
        <button class="icon-btn menu-toggle" id="menuBtn">☰</button>
        <div>
          <div class="page-title" id="pageTitle">Dashboard</div>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="right"></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="notifBtn" title="Notifications">🔔<span class="dot" id="notifDot" style="display:none">!</span></button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">?</div>
          <div class="who"><b id="userName">…</b><span id="userRole">…</span></div>
          <button class="icon-btn" id="logoutBtn" title="Logout">⏻</button>
        </div>
      </div>
    </header>
    <main class="content" id="view"><!-- routed page --></main>
  </div>
</div>

<div id="notifPanel" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><h3>🔔 Notifications</h3><button class="x" data-close>✕</button></div>
    <div class="modal-body" id="notifBody" style="max-height:60vh;overflow-y:auto"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ai-widget.js"></script>
<script src="js/app.js"></script>
</body>
</html>
